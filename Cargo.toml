[package]
name = "chat-tui"
version = "0.1.0"
description = "a terminal chat for ACP agents"
readme = "README.md"
exclude = ["CLAUDE.md", ".claude", "tmp-claude"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Jack Roddy <jack.w.roddy@gmail.com>"]

[dependencies]
agent-client-protocol = "5"
crossterm = "0.29.0"
ratatui = "0.30"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "sync", "time", "fs"] }
